name: Test existing Linux AppImage across distributions

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful build-linux.yml run ID (no automatic selection)
        required: true
        type: string
      source_commit:
        description: Full lowercase application commit SHA from that run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: linux-appimage-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.source.outputs.sha256 }}
      short_sha: ${{ steps.source.outputs.short_sha }}
    steps:
      - name: Check out test infrastructure, not the application source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source run and obtain exact artifact ID
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -Eeuo pipefail
          python3 packaging/linux/appimage/source_artifact.py \
            --run-id "$SOURCE_RUN_ID" --commit "$SOURCE_COMMIT" \
            --infrastructure-commit "$GITHUB_SHA" --output build/matrix-source
      - name: Share identical verified bytes with the matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-appimage-${{ github.run_id }}
          path: build/matrix-source/verified/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve source verification report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-verification-${{ github.run_id }}
          path: build/matrix-source/source-verification.json
          if-no-files-found: error
          retention-days: 14

  userspace:
    needs: verify-source
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        distribution: [ubuntu-22.04, ubuntu-24.04, fedora-44]
    steps:
      - name: Check out the same test infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Obtain verified source bytes from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-appimage-${{ github.run_id }}
          path: build/matrix-source/verified
      - name: Test container userspace and preserve failure evidence
        if: ${{ always() && !cancelled() }}
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_SHA256: ${{ needs.verify-source.outputs.sha256 }}
        run: |
          set -Eeuo pipefail
          python3 packaging/linux/appimage/container_matrix.py test \
            --distribution "$DISTRIBUTION" --source build/matrix-source/verified \
            --reports build/matrix-reports --sha256 "$EXPECTED_SHA256" \
            --source-commit "$SOURCE_COMMIT" --source-run-id "$SOURCE_RUN_ID" \
            --infrastructure-commit "$GITHUB_SHA"
      - name: Preserve diagnostic reports and unchanged user copy
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage-${{ needs.verify-source.outputs.short_sha }}-${{ matrix.distribution }}-${{ github.run_id }}
          path: |
            build/matrix-source/verified/*.AppImage
            build/matrix-source/verified/SHA256SUMS
            build/matrix-source/verified/provenance.json
            build/matrix-reports/*.json
            build/matrix-reports/*.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

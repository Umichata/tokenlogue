35752693, "size": 11506134, "digest": "sha256:6b639c3156d065990a7ab5bdbf3090a05811e3850079375188442af390afbb6a"}}, "release_target": "a981db908f318d3b9b9c173b94d98d7326153ef7", "release_body": "# Tokenlogue 0.1.0 — Linux & Android preview\\n\\n## English\\n\\n**Initial preview baseline — draft.** This is the starting point for Tokenlogue. The release remains unpublished until the owner explicitly requests publication.\\n\\nTokenlogue is a client for chatting with OpenRouter models on Linux and Android. It provides:\\n\\n- Separate conversations, model selection and saved drafts.\\n- English and Russian interface with desktop and mobile layouts.\\n- OpenRouter account balance read from the API and refreshed after a sent request finishes.\\n- Separate API-key limits and user-defined chat budgets, with a three-action warning before a paid request can exhaust the chat budget.\\n- PIN access, protection of supported local conversation fields and platform-specific recovery.\\n\\n### Prepared packages\\n\\nPackages in this draft are available to repository maintainers. They are not public downloads while the release is a draft.\\n\\n| Platform | File | Version and requirements |\\n| --- | --- | --- |\\n| Android | [Tokenlogue-0.1.0-android-arm64-v8a-v43.apk](https://github.com/Umichata/tokenlogue/releases/download/v0.1.0-preview.a981db9/Tokenlogue-0.1.0-android-arm64-v8a-v43.apk) | Version 0.1.0, build 43. ARM64, Android 7.0 / API 24 or later. |\\n| Linux | [Tokenlogue-0.1.0-a981db9-linux-x86_64.AppImage](https://github.com/Umichata/tokenlogue/releases/download/v0.1.0-preview.a981db9/Tokenlogue-0.1.0-a981db9-linux-x86_64.AppImage) | Version 0.1.0+43. x86_64, x86-64-v2 CPU and compatible desktop libraries. |\\n\\nCheck the selected file against [SHA256SUMS](https://github.com/Umichata/tokenlogue/releases/download/v0.1.0-preview.a981db9/SHA256SUMS) before use. Linux AppImage is unsigned. APK signature and checksums identify the supplied file and do not constitute Google approval.\\n\\nThe [Android guide](https://github.com/Umichata/tokenlogue/blob/main/docs/android.md) and [Linux guide](https://github.com/Umichata/tokenlogue/blob/main/docs/linux-appimage.md) describe installation. [User guide](https://github.com/Umichata/tokenlogue/blob/main/docs/user-guide.md), [protection](https://github.com/Umichata/tokenlogue/blob/main/docs/security.md) and the [documentation map](https://github.com/Umichata/tokenlogue/blob/main/docs/README.md) explain the application.\\n\\n### Sources and verification scope\\n\\nThe release includes the exact Android project sources for `eafb0936e0a70138d8c1e02334bb6c4183b49a10`, Linux project sources for `a981db908f318d3b9b9c173b94d98d7326153ef7`, identified dependency sources, provenance and checksums. These archives are separate from the runnable packages. Current repository documentation is maintained separately from the exact source snapshots used to build the packages.\\n\\nSee [SOURCE_MATERIALS.md](https://github.com/Umichata/tokenlogue/releases/download/v0.1.0-preview.a981db9/SOURCE_MATERIALS.md), [SOURCE_MATERIALS.json](https://github.com/Umichata/tokenlogue/releases/download/v0.1.0-preview.a981db9/SOURCE_MATERIALS.json) and [PROVENANCE.json](https://github.com/Umichata/tokenlogue/releases/download/v0.1.0-preview.a981db9/PROVENANCE.json) for the inventories and boundaries of verification.\\n\\n`REVIEW_REQUIRED` remains open for five source-to-wheel relationships involving Android CFFI, PyCryptodomex and msgpack, and Linux CFFI and PyCryptodomex. The exact libffi inside the selected CFFI wheels is not identified. Static ELF/ZIP checks cover 4 and 16 KiB alignment. Native ARM64 runtime with a 16 KiB kernel and FUSE startup are not verified. Paid live requests are not part of the runtime evidence. Sources and licenses do not alone prove the publisher-to-binary relationship or complete offline reproducibility.\\n\\n## Русский\\n\\n**Начальная точка preview — черновик.** Эта версия задаёт исходное состояние Tokenlogue. Выпуск остаётся неопубликованным до отдельного запроса владельца на публикацию.\\n\\nTokenlogue — клиент для общения с моделями OpenRouter в Linux и Android. В приложении доступны:\\n\\n- Отдельные чаты, выбор модели и сохранённые черновики.\\n- Русский и английский интерфейс с компоновкой для компьютера и мобильного устройства.\\n- Баланс аккаунта OpenRouter из API с обновлением после завершения отправленного запроса.\\n- Отдельные лимиты API-ключа и пользовательские бюджеты чатов. Перед возможным исчерпанием денежного бюджета платным запросом появляется предупреждение с тремя действиями.\\n- Вход по PIN, защита поддерживаемых локальных полей переписки и восстановление с учётом возможностей платформы.\\n\\n### Подготовленные пакеты\\n\\nФайлы этого черновика доступны сопровождающим репозитория. Пока выпуск остаётся черновиком, публичной загрузки пакетов нет.\\n\\n| Платформа | Файл | Версия и требования |\\n| --- | --- | --- |\\n| Android | [Tokenlogue-0.1.0-android-arm64-v8a-v43.apk](https://github.com/Umichata/tokenlogue/releases/download/v0.1.0-preview.a981db9/Tokenlogue-0.1.0-android-arm64-v8a-v43.apk) | Версия 0.1.0, сборка 43. ARM64, Android 7.0 / API 24 или новее. |\\n| Linux | [Tokenlogue-0.1.0-a981db9-linux-x86_64.AppImage](https://github.com/Umichata/tokenlogue/releases/download/v0.1.0-preview.a981db9/Tokenlogue-0.1.0-a981db9-linux-x86_64.AppImage) | Версия 0.1.0+43. x86_64, процессор x86-64-v2 и совместимые библиотеки рабочего стола. |\\n\\nПеред использованием проверьте выбранный файл по [SHA256SUMS](https://github.com/Umichata/tokenlogue/releases/download/v0.1.0-preview.a981db9/SHA256SUMS). AppImage Linux не подписана. Подпись APK и контрольные суммы определяют поставленный файл и не означают одобрения Google.\\n\\nУстановка описана в [руководстве Android](https://github.com/Umichata/tokenlogue/blob/main/docs/android.ru.md) и [руководстве Linux](https://github.com/Umichata/tokenlogue/blob/main/docs/linux-appimage.ru.md). Работу приложения объясняют [руководство пользователя](https://github.com/Umichata/tokenlogue/blob/main/docs/user-guide.ru.md), [защита](https://github.com/Umichata/tokenlogue/blob/main/docs/security.ru.md) и [карта документации](https://github.com/Umichata/tokenlogue/blob/main/docs/README.ru.md).\\n\\n### Исходники и границы проверки\\n\\nВ комплект входят точные исходники Android для `eafb0936e0a70138d8c1e02334bb6c4183b49a10`, Linux для `a981db908f318d3b9b9c173b94d98d7326153ef7`, идентифицированные исходные материалы зависимостей, сведения о происхождении и контрольные суммы. Эти архивы скачиваются отдельно от готовых приложений. Текущая документация репозитория ведётся отдельно от точных снимков, использованных для сборки пакетов.\\n\\nОписи и границы подтверждений находятся в [SOURCE_MATERIALS.md](https://github.com/Umichata/tokenlogue/releases/download/v0.1.0-preview.a981db9/SOURCE_MATERIALS.md), [SOURCE_MATERIALS.json](https://github.com/Umichata/tokenlogue/releases/download/v0.1.0-preview.a981db9/SOURCE_MATERIALS.json) и [PROVENANCE.json](https://github.com/Umichata/tokenlogue/releases/download/v0.1.0-preview.a981db9/PROVENANCE.json).\\n\\n`REVIEW_REQUIRED` остаётся открытым для пяти связей source-to-wheel. Они относятся к Android CFFI, PyCryptodomex и msgpack, а также Linux CFFI и PyCryptodomex. Точная libffi внутри выбранных CFFI wheels не определена. Статические ELF/ZIP проверки охватывают выравнивание 4 и 16 КиБ. Нативный ARM64 runtime с ядром 16 КиБ и запуск через FUSE не проверены. Живые платные запросы не входят в runtime-доказательства. Наличие исходников и лицензий само по себе не доказывает происхождение стороннего бинарника и полную автономную офлайн-пересборку.\\n", "provenance": {"schema": 1, "application": "Tokenlogue", "version": "0.1.0", "release_tag": "v0.1.0-preview.a981db9", "release_target_commit": "a981db908f318d3b9b9c173b94d98d7326153ef7", "created_utc": "2026-11-11T13:58:02.382427+00:00", "preview_version_policy": "The initial preview baseline is 0.1.0 and 
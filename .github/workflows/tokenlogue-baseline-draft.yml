                  data = json.dumps(body, ensure_ascii=False).encode('utf-8')
              result = run(command, stdin=data, allow_missing=optional)
              if result is None:
                  return None
              return result if raw else json.loads(result)
          
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          
          def files_to_write():
              files = {
                  'RELEASE_NOTES.md': PAYLOAD['release_body'].encode('utf-8'),
                  'PROVENANCE.json': (json.dumps(PAYLOAD['provenance'], ensure_ascii=False, indent=2) + '\n').encode('utf-8'),
              }
              sums = []
              for name in PAYLOAD['checksum_order']:
                  digest = sha(files[name]) if name in files else PAYLOAD['assets'][name]['digest'].split(':', 1)[1]
                  sums.append(digest + '  ' + name + '\n')
              files['SHA256SUMS'] = ''.join(sums).encode('utf-8')
              return files
          
          def validate_assets(release, new_files):
              if release['id'] != RELEASE_ID or release['tag_name'] != TAG:
                  stop('Не совпадает идентификатор или тег выпуска. Никакая замена не разрешена.')
              if release['target_commitish'] != PAYLOAD['release_target']:
                  stop('Изменился исходный target выпуска. Проверьте актуальное состояние.')
              if sha((release.get('body') or '').encode('utf-8')) not in {
                  PAYLOAD['original_body_sha256'], sha(PAYLOAD['release_body'].encode('utf-8'))
              }:
                  stop('Описание выпуска изменилось после подготовки. Оно не перезаписывается автоматически.')
              if release.get('immutable'):
                  stop('Выпуск неизменяемый. Скрипт не обходит эту защиту.')
              current = {a['name']: a for a in release['assets']}
              if len(current) != len(release['assets']) or set(current) - set(PAYLOAD['assets']):
                  stop('Набор assets изменился. Непроверенные файлы не затрагиваются.')
              missing = set(PAYLOAD['assets']) - set(current)
              if missing - REWRITABLE or (missing and not release['draft']):
                  stop('Отсутствуют ожидаемые файлы. Проверьте выпуск вручную.')
              for name, item in current.items():
                  expected = PAYLOAD['assets'][name]
                  original = (item['size'], item.get('digest')) == (expected['size'], expected['digest'])
                  prepared = name in new_files and (item['size'], item.get('digest')) == (len(new_files[name]), 'sha256:' + sha(new_files[name]))
                  if not original and not prepared:
                      stop('Изменилось содержимое asset: ' + name)
                  if name not in REWRITABLE and item['id'] != expected['id']:
                      stop('Изменился ID сохранённого asset: ' + name)
          
          def ref(branch, optional=False):
              item = api(PREFIX + '/git/ref/heads/' + branch, optional=optional)
              return None if item is None else item['object']['sha']
          
          def self_check(new_files):
              assert set(PAYLOAD['refs']) == {'main', 'android', 'linux'}
              assert set(PAYLOAD['assets']) - set(PAYLOAD['checksum_order']) == {'SHA256SUMS'}
              assert set(new_files) == REWRITABLE
              assert 'What changed' not in PAYLOAD['release_body']
              assert '\n## Изменения' not in PAYLOAD['release_body']
              assert '0.2.0' not in PAYLOAD['release_body']
              assert PAYLOAD['provenance']['release_target_commit'] == PAYLOAD['release_target']
              assert PAYLOAD['provenance']['version'] == '0.1.0'
              assert len(PAYLOAD['assets']) == 10
              # Проверяем, что охранный код действительно отвергает изменение бинарника.
              test = {'id': RELEASE_ID, 'tag_name': TAG, 'target_commitish': PAYLOAD['release_target'],
                      'immutable': False, 'draft': False, 'body': PAYLOAD['release_body'],
                      'assets': [dict(item, name=name) for name, item in PAYLOAD['assets'].items()]}
              for item in test['assets']:
                  if item['name'].endswith('.apk'):
                      item['digest'] = 'sha256:' + '0' * 64
              try:
                  validate_assets(test, new_files)
              except RuntimeError:
                  pass
              else:
                  stop('Проверка защиты бинарников не сработала.')
          
          
          def maintain_release():
              if os.environ.get('GITHUB_REPOSITORY') != REPO or os.environ.get('GITHUB_ACTOR') != 'Umichata':
                  stop('Only the repository owner can dispatch this one-time job.')
              if os.environ.get('GITHUB_REF') != 'refs/heads/main':
                  stop('Only main may run this job.')
              dispatch_head = os.environ['GITHUB_SHA']
              if ref('main') != dispatch_head:
                  stop('main moved after dispatch; nothing is changed.')
              commit = api(PREFIX + '/commits/' + dispatch_head)
              if [p['sha'] for p in commit['parents']] != [PAYLOAD['refs']['main']['old']]:
                  stop('Unexpected workflow parent; inspect the repository first.')
              expected_path = '.github/workflows/tokenlogue-baseline-draft.yml'
              if [(f['filename'], f['status']) for f in commit['files']] != [(expected_path, 'added')]:
                  stop('The dispatch commit must only add the reviewed temporary workflow.')
              for branch in ('android', 'linux'):
                  if ref(branch) != PAYLOAD['refs'][branch]['old']:
                      stop('A platform branch changed; nothing is changed.')
              branches = api(PREFIX + '/branches?per_page=100')
              expected_branches = set(PAYLOAD['refs']) | set(PAYLOAD['extra_branches'])
              if {b['name'] for b in branches} != expected_branches:
                  stop('The branch set changed; nothing is changed.')
              for branch, expected in PAYLOAD['extra_branches'].items():
                  if ref(branch) != expected:
                      stop('An extra branch changed; nothing is deleted.')
                  comparison = api(PREFIX + '/compare/' + expected + '...' + PAYLOAD['refs']['main']['old'])
                  if comparison['status'] not in ('ahead', 'identical'):
                      stop('An extra branch is not merged; nothing is deleted.')
              runtime_before = api(PREFIX + '/releases/440334413')
              runtime_assets = {a['name']: (a['id'], a['size'], a.get('digest')) for a in runtime_before['assets']}
              release = api(PREFIX + '/releases/' + str(RELEASE_ID))
              new_files = files_to_write()
              self_check(new_files)
              validate_assets(release, new_files)
              output = Path(os.environ['RUNNER_TEMP']) / 'tokenlogue-baseline-result'
              output.mkdir(parents=True, exist_ok=False)
              (output / 'release-before.json').write_text(json.dumps(release, ensure_ascii=False, indent=2) + '\n')
              (output / 'branches-before.json').write_text(json.dumps(branches, ensure_ascii=False, indent=2) + '\n')
              # Back up the three replaceable documents before any write.
              for item in release['assets']:
                  if item['name'] in REWRITABLE:
                      data = api(PREFIX + '/releases/assets/' + str(item['id']), raw=True)
                      if sha(data) != item['digest'].split(':', 1)[1]:
                          stop('Downloaded original asset failed its digest check.')
                      (output / (item['name'] + '.before')).write_bytes(data)
              api(PREFIX + '/releases/' + str(RELEASE_ID), method='PATCH', body={
                  'draft': True, 'prerelease': True, 'make_latest': 'false',
                  'name': 'Tokenlogue 0.1.0 — Linux & Android preview',
                  'body': PAYLOAD['release_body'],
              })
              drafted = api(PREFIX + '/releases/' + str(RELEASE_ID))
              if not drafted['draft'] or not drafted['prerelease']:
                  stop('Draft status was not confirmed. No upload or ref deletion is attempted.')
              for name in ('RELEASE_NOTES.md', 'PROVENANCE.json', 'SHA256SUMS'):
                  path = output / name
                  path.write_bytes(new_files[name])
                  run(['gh', 'release', 'upload', TAG, str(path), '--clobber', '--repo', REPO])
              for attempt in range(6):
                  after = api(PREFIX + '/releases/' + str(RELEASE_ID))
                  available = {a['name']: a for a in after['assets']}
                  if all(name in available and available[name].get('digest') == 'sha256:' + sha(content)
                         for name, content in new_files.items()):
                      break
                  if attempt < 5:
                      time.sleep(2)
              validate_assets(after, new_files)
              if not (after['draft'] and after['prerelease'] and len(after['assets']) == 10 and after['body'] == PAYLOAD['release_body']):
                  stop('Unexpected final release state.')
              for name, content in new_files.items():
                  item = available[name]
                  if (item['size'], item.get('digest')) != (len(content), 'sha256:' + sha(content)):
                      stop('Updated document digest or size mismatch.')
              # Atomic deletion with exact leases: a concurrent branch update is never discarded.
              transport = output / 'transport.git'
              run(['git', 'init', '--bare', '--quiet', str(transport)])
              git = ['git', '-C', str(transport), '-c', 'credential.helper=', '-c', 'credential.helper=!gh auth git-credential']
              run(git + ['remote', 'add', 'origin', 'https://github.com/' + REPO + '.git'])
              run(git + ['fetch', '--no-tags', 'origin', dispatch_head, *PAYLOAD['extra_branches'].values()])
              for branch, expected in PAYLOAD['extra_branches'].items():
                  run(git + ['merge-base', '--is-ancestor', expected, dispatch_head])
                  if ref(branch) != expected:
                      stop('An extra branch changed; no branch is deleted.')
              if ref('main') != dispatch_head:
                  stop('main moved; no branch is deleted.')
              command = git + ['push', '--atomic']
              command += ['--force-with-lease=refs/heads/' + b + ':' + s for b, s in PAYLOAD['extra_branches'].items()]
              command += ['origin'] + [':refs/heads/' + b for b in PAYLOAD['extra_branches']]
              run(command)
              for branch in PAYLOAD['extra_branches']:
                  if ref(branch, optional=True) is not None:
                      stop('Branch deletion was not confirmed.')
              branches_after = api(PREFIX + '/branches?per_page=100')
              if {b['name'] for b in branches_after} != {'main', 'android', 'linux'}:
                  stop('Unexpected remaining branch set.')
              for branch in ('android', 'linux'):
                  if ref(branch) != PAYLOAD['refs'][branch]['old']:
                      stop('A platform branch changed during the job.')
              runtime_after = api(PREFIX + '/releases/440334413')
              if {a['name']: (a['id'], a['size'], a.get('digest')) for a in runtime_after['assets']} != runtime_assets:
                  stop('Runtime kit changed during the job.')
              if any(runtime_after.get(k) != runtime_before.get(k) for k in ('tag_name', 'draft', 'prerelease', 'target_commitish')):
                  stop('Runtime release metadata changed during the job.')
              (output / 'release-after.json').write_text(json.dumps(after, ensure_ascii=False, indent=2) + '\n')
              (output / 'branches-after.json').write_text(json.dumps(branches_after, ensure_ascii=False, indent=2) + '\n')
              (output / 'runtime-release-after.json').write_text(json.dumps(runtime_after, ensure_ascii=False, indent=2) + '\n')
              # The separate prepared documentation commits are applied by the owner connector afterward.
              summary = {
                  'release_id': RELEASE_ID, 'draft': True, 'prerelease': True,
                  'tag': TAG, 'target': PAYLOAD['release_target'], 'asset_count': len(after['assets']),
                  'replaced_documents': {name: sha(content) for name, content in new_files.items()},
                  'removed_branches': PAYLOAD['extra_branches'],
                  'remaining_branches': ['main', 'android', 'linux'],
                  'binaries_sources_and_runtime_kit': 'PRESERVED',
                  'documentation_branch_updates': 'PENDING_CONNECTOR',
                  'temporary_workflow_cleanup': 'PENDING_CONNECTOR',
              }
              (output / 'result.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')
              print(json.dumps(summary, ensure_ascii=False, indent=2))
          
          
          if __name__ == '__main__':
              try:
                  maintain_release()
              except Exception as error:
                  print('STOP: ' + str(error), file=sys.stderr)
                  sys.exit(1)
          TOKENLOGUE_MAINTENANCE
      - name: Preserve maintenance evidence and original documents
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # Shared project pin, v7.0.1
        with:
          name: tokenlogue-baseline-draft-evidence
          path: |
            ${{ runner.temp }}/tokenlogue-baseline-result/*.json
            ${{ runner.temp }}/tokenlogue-baseline-result/*.before
            ${{ runner.temp }}/tokenlogue-baseline-result/RELEASE_NOTES.md
            ${{ runner.temp }}/tokenlogue-baseline-result/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7

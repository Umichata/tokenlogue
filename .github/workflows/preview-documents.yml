name: Update preview documents

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tokenlogue-preview-documents
  cancel-in-progress: false

jobs:
  documents:
    if: github.repository == 'Umichata/tokenlogue' && github.ref == 'refs/heads/main' && github.actor == 'Umichata'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Update preview documents
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'TOKENLOGUE_PREVIEW_DOCUMENTS'
          #!/usr/bin/env python3
          """Update the documents attached to Tokenlogue 0.1.0 Preview."""
          
          from __future__ import annotations
          
          import base64
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path
          
          PAYLOAD = json.loads('{"release":{"id":441781663,"name":"Tokenlogue 0.1.0 Preview","tag_name":"v0.1.0-preview.a981db9","target_commitish":"a981db908f318d3b9b9c173b94d98d7326153ef7","draft":true,"prerelease":true,"immutable":false},"body_sha256":"a4f874d120c1fb474bdf6c6ed354cec469e3e8a089faf33083ef4cac3af0e96d","assets":{"PROVENANCE.json":{"id":739084503,"size":7690,"digest":"sha256:2f48d34e39050869a954ae19f4e1f207fa47fd91345178e0fd908cfea70cac94"},"RELEASE_NOTES.md":{"id":739084370,"size":9072,"digest":"sha256:94479d04fd26b2899125179eecd0f325506bc36df14c29fff59438aec728d115"},"SHA256SUMS":{"id":739084586,"size":912,"digest":"sha256:e501c45148ee51aa99cfce151c3a072ea6df524eeb81c8d7628d901551bf083b"},"SOURCE_MATERIALS.json":{"id":735753154,"size":897191,"digest":"sha256:8bb05e15a620db7bb8d4868667c78fe09341d5add8bb0a55470c113dc8349a93"},"SOURCE_MATERIALS.md":{"id":735753298,"size":10430,"digest":"sha256:a7c8b842afba528c249303e44a4c604dfee224926be71ba8a81c49c48af17609"},"Tokenlogue-0.1.0-a981db9-linux-project-sources.tar.gz":{"id":735752748,"size":11508039,"digest":"sha256:75b0164d0b7f9432e3094bc537c3b5c7914df0fe116849929c981a5b40fb2781"},"Tokenlogue-0.1.0-a981db9-linux-x86_64.AppImage":{"id":735751844,"size":35367304,"digest":"sha256:247497d8f97aae0c16cab282edc1c6cbf47747c7b3597e3ba23b388558e40646"},"Tokenlogue-0.1.0-android-arm64-v8a-v43.apk":{"id":735751895,"size":56202990,"digest":"sha256:1e3ec65aaf1863eb50257aa4c090ca5fdf0b6b2c637c415d5b02056a2cf941f5"},"Tokenlogue-0.1.0-dependency-sources.tar.gz":{"id":735752875,"size":1188171591,"digest":"sha256:7c760abaaf91428201b6417c70fe88d62ba0024cf1286f2703de734bf9c95f2f"},"Tokenlogue-0.1.0-eafb093-android-project-sources.tar.gz":{"id":735752693,"size":11506134,"digest":"sha256:6b639c3156d065990a7ab5bdbf3090a05811e3850079375188442af390afbb6a"}},"files":{"RELEASE_NOTES.md":{"base64":"","size":13111,"sha256":"287c1d1c2577a7efdcf65a298463a7e5d774c8d9a3fca9804d6f1d3b92ba3b66"},"PROVENANCE.json":{"base64":"","size":2287,"sha256":"76b81e8b6074ec5d031b3e54875041f2205b837473941a7c1316c5ac72143269"},"SOURCE_MATERIALS.md":{"base64":"","size":10457,"sha256":"5b891dfbc20d5c0021149343528078fb0bc506b4f7fc49faecd689d9f18e2232"},"SHA256SUMS":{"base64":"","size":912,"sha256":"8e2bdea47a8b2f4f110997a4c0b02f16f085db6f67eb316df342c2d581ec3cfd"}}}')
          REPOSITORY = "Umichata/tokenlogue"
          PREFIX = "repos/" + REPOSITORY
          RELEASE_ID = 441781663
          RUNTIME_RELEASE_ID = 440334413
          WORKFLOW_PATH = ".github/workflows/preview-documents.yml"
          PARENT_COMMIT = "1abdcf54001402f2fde79663179321f5492a760b"
          DOCUMENTS = ("RELEASE_NOTES.md", "PROVENANCE.json", "SOURCE_MATERIALS.md", "SHA256SUMS")
          ENV = dict(os.environ)
          for key in list(ENV):
              if key.startswith(("GIT_TRACE", "GH_DEBUG")) or key == "GIT_CURL_VERBOSE":
                  ENV.pop(key)
          ENV["GH_HOST"] = "github.com"
          ENV["GH_PROMPT_DISABLED"] = "1"
          
          
          def stop():
              raise RuntimeError("Preview document update stopped.")
          
          
          def digest(content):
              return hashlib.sha256(content).hexdigest()
          
          
          def normalized(text):
              return text.replace("\r\n", "\n").strip()
          
          
          def command(arguments):
              result = subprocess.run(arguments, stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=ENV)
              if result.returncode:
                  stop()
              return result.stdout
          
          
          def api(path):
              result = command(["gh", "api", path, "--header", "Accept: application/vnd.github+json"])
              return json.loads(result)
          
          
          def ref():
              return api(PREFIX + "/git/ref/heads/main")["object"]["sha"]
          
          
          def decode_files():
              if set(PAYLOAD["files"]) != set(DOCUMENTS):
                  stop()
              files = {}
              for name in DOCUMENTS:
                  item = PAYLOAD["files"][name]
                  content = base64.b64decode(item["base64"], validate=True)
                  if (len(content), digest(content)) != (item["size"], item["sha256"]):
                      stop()
                  files[name] = content
              entries = {}
              lines = files["SHA256SUMS"].decode().splitlines()
              for line in lines:
                  match = re.fullmatch(r"([0-9a-f]{64})  (.+)", line)
                  if not match or match[2] in entries:
                      stop()
                  entries[match[2]] = match[1]
              if set(entries) != set(PAYLOAD["assets"]) - {"SHA256SUMS"} or len(entries) != 9:
                  stop()
              for name, expected in entries.items():
                  actual = digest(files[name]) if name in files else PAYLOAD["assets"][name]["digest"].split(":", 1)[1]
                  if actual != expected:
                      stop()
              return files
          
          
          def validate_release(release, files, allow_updated=False):
              for key, expected in PAYLOAD["release"].items():
                  if release.get(key) != expected:
                      stop()
              if release.get("id") != RELEASE_ID or not release.get("draft") or not release.get("prerelease") or release.get("immutable"):
                  stop()
              body = release.get("body") or ""
              if digest(body.encode()) != PAYLOAD["body_sha256"] and normalized(body) != normalized(files["RELEASE_NOTES.md"].decode()):
                  stop()
              actual = {item["name"]: item for item in release["assets"]}
              if set(actual) != set(PAYLOAD["assets"]) or len(actual) != len(release["assets"]) or len(actual) != 10:
                  stop()
              for name, item in actual.items():
                  expected = PAYLOAD["assets"][name]
                  original = all(item.get(key) == expected[key] for key in ("id", "size", "digest"))
                  updated = allow_updated and name in files and (item["size"], item.get("digest")) == (len(files[name]), "sha256:" + digest(files[name]))
                  if not original and not updated:
                      stop()
              return actual
          
          
          def release_identity(release):
              fields = ("id", "name", "tag_name", "target_commitish", "draft", "prerelease", "immutable", "body")
              return {key: release.get(key) for key in fields}
          
          
          def runtime_identity(release):
              identity = release_identity(release)
              items = release["assets"]
              assets = {item["name"]: (item["id"], item["size"], item.get("digest")) for item in items}
              if release.get("id") != RUNTIME_RELEASE_ID or len(items) != 5 or len(assets) != 5:
                  stop()
              return identity, assets
          
          
          def validate_dispatch():
              if os.environ.get("GITHUB_REPOSITORY") != REPOSITORY or os.environ.get("GITHUB_ACTOR") != "Umichata" or os.environ.get("GITHUB_REF") != "refs/heads/main":
                  stop()
              head = os.environ["GITHUB_SHA"]
              if ref() != head:
                  stop()
              commit = api(PREFIX + "/commits/" + head)
              if [item["sha"] for item in commit["parents"]] != [PARENT_COMMIT]:
                  stop()
              if [(item["filename"], item["status"]) for item in commit["files"]] != [(WORKFLOW_PATH, "added")]:
                  stop()
              return head
          
          
          def update_documents():
              if not shutil.which("gh"):
                  stop()
              files = decode_files()
              head = validate_dispatch()
              runtime_before = runtime_identity(api(PREFIX + "/releases/" + str(RUNTIME_RELEASE_ID)))
              release = api(PREFIX + "/releases/" + str(RELEASE_ID))
              validate_release(release, files)
              identity_before = release_identity(release)
              with tempfile.TemporaryDirectory(prefix="tokenlogue-preview-") as folder:
                  for name in DOCUMENTS:
                      current = api(PREFIX + "/releases/" + str(RELEASE_ID))
                      validate_release(current, files, allow_updated=True)
                      if release_identity(current) != identity_before or ref() != head:
                          stop()
                      path = Path(folder) / name
                      path.write_bytes(files[name])
                      command(["gh", "release", "upload", PAYLOAD["release"]["tag_name"], str(path), "--clobber", "--repo", REPOSITORY])
                      for attempt in range(10):
                          current = api(PREFIX + "/releases/" + str(RELEASE_ID))
                          item = next((item for item in current["assets"] if item["name"] == name), None)
                          if item and (item["size"], item.get("digest")) == (len(files[name]), "sha256:" + digest(files[name])):
                              break
                          if attempt < 9:
                              time.sleep(1)
                      else:
                          stop()
              after = api(PREFIX + "/releases/" + str(RELEASE_ID))
              actual = validate_release(after, files, allow_updated=True)
              if release_identity(after) != identity_before or ref() != head:
                  stop()
              for name in DOCUMENTS:
                  if (actual[name]["size"], actual[name].get("digest")) != (len(files[name]), "sha256:" + digest(files[name])):
                      stop()
              if runtime_identity(api(PREFIX + "/releases/" + str(RUNTIME_RELEASE_ID))) != runtime_before:
                  stop()
              print("Preview documents updated. Draft retained.")
          
          
          if __name__ == "__main__":
              try:
                  update_documents()
              except Exception:
                  sys.exit(1)
          TOKENLOGUE_PREVIEW_DOCUMENTS
